name: Documentation

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # required for gh-deploy / mike push to gh-pages

jobs:
  # ── Job 1: strict build check ─────────────────────────────────────────────
  # Runs on every PR and every push. Catches broken references and bad links
  # before they reach main or a release.
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: pip install -e ".[docs]" "mkdocs>=1.5,<2.0" "mkdocs-material>=9.5,<10.0"

      - name: mkdocs build --strict
        run: mkdocs build --strict

  # ── Job 2: deploy ─────────────────────────────────────────────────────────
  # Runs only on push events (not on PRs).
  #   • push to main  → deploys as "dev" alias
  #   • push of v*.*.*tag → deploys as "<version>" and updates "latest" alias
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mike needs full git history to manage gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: pip install -e ".[docs]" "mkdocs>=1.5,<2.0" "mkdocs-material>=9.5,<10.0"

      - name: Configure git identity for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Push to main → publish under the "dev" label.
      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push dev

      # Version tag → publish under "<X.Y.Z>" and update the "latest" alias.
      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
