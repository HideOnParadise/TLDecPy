name: Publish to PyPI (Trusted OIDC)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*' # Version tags (e.g., v0.8.0, v0.8.0rc1)

permissions:
  id-token: write # Required for OIDC Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi # Configure this environment in GitHub
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: python -m pip install --upgrade build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # This action uses OIDC (id-token) so no API token is needed
